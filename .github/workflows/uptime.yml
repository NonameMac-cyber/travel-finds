name: Uptime check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-check
  cancel-in-progress: true

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check public pages and feeds
        shell: bash
        run: |
          set -euo pipefail
          base="https://nonamemac-cyber.github.io/travel-finds"
          urls=(
            "$base/"
            "$base/es.html"
            "$base/blog/"
            "$base/es/blog/"
            "$base/privacy.html"
            "$base/es/privacy.html"
            "$base/cookies.html"
            "$base/about.html"
            "$base/sitemap.xml"
            "$base/feed.xml"
            "$base/robots.txt"
          )
          fail=0
          for url in "${urls[@]}"; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 25 "$url" || printf '000')
            printf '%s %s\n' "$code" "$url"
            if [ "$code" = "200" ]; then
              continue
            fi
            fail=1
          done
          if [ "$fail" = "1" ]; then
            echo "::error::One or more public URLs failed the uptime check"
            exit 1
          fi
          echo "All public URLs returned HTTP 200"
