name: Build and publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-static-site
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static site
        env:
          VERCEL: '1'
        run: python3 _src/tools/build_site.py

      - name: Verify generated site
        run: |
          test -f _src/build/index.html
          test -f _src/build/es.html
          test -f _src/build/blog/index.html
          test -f _src/build/sitemap.xml
          echo "Static site build verified."

      - name: SEO metadata audit
        run: python3 _src/tools/seo_check.py --report _src/reports/seo-report.json

      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --exclude '^https://nonamemac-cyber\.github\.io'
            --no-progress
            './_src/build/**/*.html'
          output: lychee-internal.md
          fail: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-seo-report
          path: |
            _src/reports/seo-report.json
            lychee-internal.md
          if-no-files-found: warn

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_src/build
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'Publish static site'
